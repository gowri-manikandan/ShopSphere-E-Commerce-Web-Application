<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Shop the latest products in electronics, fashion, and books on Sri Maruthi textiles - Your modern e-commerce destination.">
    <title>Sri Maruthi textiles — E-Commerce Storefront</title>
    <!-- Stylesheet -->
    <link rel="stylesheet" href="css/styles.css">
    <style>
        /* ✨ Ask AI semantic-search panel */
        .ai-search-panel { position: relative; border-radius: 16px; padding: 20px 22px; margin-bottom: 20px;
            background: linear-gradient(135deg, rgba(99,102,241,.09), rgba(59,130,246,.05)); border: 1px solid rgba(99,102,241,.28); }
        .ai-search-head { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 14px; }
        .ai-spark { font-size: 22px; line-height: 1; filter: drop-shadow(0 1px 5px rgba(99,102,241,.45)); }
        .ai-search-title { margin: 0; font-size: 16px; font-weight: 800;
            background: linear-gradient(90deg, #6366f1, #3b82f6); -webkit-background-clip: text; background-clip: text; color: transparent; }
        .ai-search-sub { margin: 3px 0 0; font-size: 13px; color: var(--text-muted); }
        .ai-search-inputrow { display: flex; gap: 10px; }
        .ai-search-inputrow .form-control { flex: 1; }
        .ai-search-btn { white-space: nowrap; background: linear-gradient(90deg, #6366f1, #3b82f6); border: none; }
        .ai-search-btn:hover { filter: brightness(1.06); }
        .ai-chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
        .ai-chip { border: 1px solid var(--border-color); background: #fff; border-radius: 999px; padding: 6px 12px;
            font-size: 13px; cursor: pointer; color: var(--text-main); transition: all .15s ease; }
        .ai-chip:hover { border-color: var(--primary); color: var(--primary); transform: translateY(-1px); }
        .ai-results-header { display: flex; align-items: center; justify-content: space-between; gap: 12px;
            margin-bottom: 16px; padding: 10px 14px; border-radius: 10px;
            background: rgba(99,102,241,.06); border: 1px solid rgba(99,102,241,.2); }
        .ai-results-label { font-size: 14px; color: var(--text-main); }
        @media (max-width: 600px) { .ai-search-inputrow { flex-direction: column; } }
    </style>
</head>
<body>

    <!-- Shared Navigation Bar -->
    <header id="navbar-container"></header>

    <!-- Main Content Area -->
    <main class="container">
        <div class="catalog-container">
            
            <!-- Category Sidebar Filter -->
            <aside class="catalog-sidebar">
                <h4 class="sidebar-title">Categories</h4>
                <div id="category-list" class="category-list">
                    <!-- Categories will be dynamically loaded here -->
                </div>

                <h4 class="sidebar-title" style="margin-top: 28px;">Price Range</h4>
                <div class="price-filter">
                    <input type="number" id="min-price-input" class="form-control" placeholder="Min ₹" min="0" aria-label="Minimum price">
                    <span class="price-filter-sep">–</span>
                    <input type="number" id="max-price-input" class="form-control" placeholder="Max ₹" min="0" aria-label="Maximum price">
                </div>

                <h4 class="sidebar-title" style="margin-top: 28px;">Minimum Rating</h4>
                <div id="rating-filter" class="rating-filter">
                    <button type="button" class="rating-option active" data-min-rating="0">Any rating</button>
                    <button type="button" class="rating-option" data-min-rating="4">★ 4 &amp; up</button>
                    <button type="button" class="rating-option" data-min-rating="3">★ 3 &amp; up</button>
                    <button type="button" class="rating-option" data-min-rating="2">★ 2 &amp; up</button>
                    <button type="button" class="rating-option" data-min-rating="1">★ 1 &amp; up</button>
                </div>

                <button type="button" id="clear-filters-btn" class="btn btn-secondary btn-sm" style="margin-top: 24px; width: 100%;">Clear Filters</button>
            </aside>
            
            <!-- Catalog Main Panel -->
            <section class="catalog-main">
                
                <!-- Search & Filters Header -->
                <div class="search-bar-container">
                    <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" width="20" height="20">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-5.197-5.197m0 0A7.5 7.5 0 105.196 5.196a7.5 7.5 0 0010.637 10.637z" />
                    </svg>
                    <input type="text" id="search-input" class="form-control search-input" placeholder="Search for products, brands or models...">
                </div>

                <!-- ✨ Ask AI — natural-language semantic search (§6) -->
                <div class="ai-search-panel" id="ai-search-panel">
                    <div class="ai-search-head">
                        <span class="ai-spark">✨</span>
                        <div>
                            <h3 class="ai-search-title">Ask AI</h3>
                            <p class="ai-search-sub">Describe what you want in plain English — our AI finds the closest products.</p>
                        </div>
                    </div>
                    <div class="ai-search-inputrow">
                        <input type="text" id="ai-search-input" class="form-control" autocomplete="off"
                               placeholder="e.g. a thoughtful gift for someone who loves running">
                        <button type="button" id="ai-search-btn" class="btn btn-primary ai-search-btn">Ask AI</button>
                    </div>
                    <div class="ai-chips">
                        <button type="button" class="ai-chip" data-q="a thoughtful gift for a runner">🎁 gift for a runner</button>
                        <button type="button" class="ai-chip" data-q="something to upgrade my kitchen">🍳 upgrade my kitchen</button>
                        <button type="button" class="ai-chip" data-q="affordable wireless headphones">🎧 budget headphones</button>
                        <button type="button" class="ai-chip" data-q="a good book to relax with">📚 book to relax</button>
                    </div>
                </div>

                <!-- AI results header (shown only while AI results are displayed) -->
                <div id="ai-results-header" class="ai-results-header" style="display:none;">
                    <span id="ai-results-label" class="ai-results-label"></span>
                    <button type="button" id="ai-clear-btn" class="btn btn-secondary btn-sm">← Back to catalog</button>
                </div>

                <!-- Product Grid -->
                <div id="product-grid" class="product-grid">
                    <!-- Products or skeletons will be loaded here -->
                </div>

                <!-- Empty State -->
                <div id="empty-catalog-state" class="empty-state" style="display: none;">
                    <div class="empty-icon">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" width="64" height="64">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M15.182 16.318A4.486 4.486 0 0012.016 15a4.486 4.486 0 00-3.197 1.318M21 12a9 9 0 11-18 0 9 9 0 0118 0zM9.75 9.75c0 .414-.168.75-.375.75s-.375-.336-.375-.75.168-.75.375-.75.375.336.375.75zm-.375 0h.008v.015h-.008V9.75zm5.625 0c0 .414-.168.75-.375.75s-.375-.336-.375-.75.168-.75.375-.75.375.336.375.75zm-.375 0h.008v.015h-.008V9.75z" />
                        </svg>
                    </div>
                    <h3 class="empty-title">No products found</h3>
                    <p class="empty-desc">We couldn't find any products matching your search or category selection. Try refining your keywords.</p>
                    <button id="reset-filters-btn" class="btn btn-primary">View All Products</button>
                </div>
                
            </section>
        </div>
    </main>

    <!-- Realtime (live stock) — classic scripts expose window.SockJS / window.StompJs -->
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1.6.1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7.0.0/bundles/stomp.umd.min.js"></script>

    <!-- Main JavaScript Logic -->
    <script type="module" src="js/catalog.js?v=3"></script>
</body>
</html>
