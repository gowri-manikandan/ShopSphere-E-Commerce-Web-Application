<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Sign in to your ShopSphere account.">
    <title>Login — ShopSphere</title>
    <!-- Set theme before first paint to avoid a flash of the wrong mode -->
    <script>
        (function () {
            try {
                var t = localStorage.getItem('theme');
                if (t !== 'light' && t !== 'dark') {
                    t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
                }
                document.documentElement.setAttribute('data-theme', t);
            } catch (e) {}
        })();
    </script>
    <link rel="stylesheet" href="css/styles.css">
    <style>
        /* ===== Glassmorphic auth theme (shared look with register.html) ===== */
        .auth-wrapper {
            position: relative;
            min-height: calc(100vh - 120px);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
            padding: 40px 20px;
        }

        /* Animated glowing background blobs */
        .auth-bg-blobs {
            position: absolute;
            inset: 0;
            z-index: 0;
            pointer-events: none;
        }
        .blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.15;
            animation: floatBlobs 20s infinite alternate ease-in-out;
        }
        .blob-1 { width: 320px; height: 320px; background-color: var(--primary); top: 15%; left: 10%; }
        .blob-2 { width: 280px; height: 280px; background-color: #ec4899; bottom: 15%; right: 10%; animation-delay: -5s; }
        @keyframes floatBlobs {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(50px, -50px) scale(1.25); }
        }

        /* Glass card */
        .glass-card {
            position: relative;
            z-index: 1;
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(20px) saturate(190%);
            -webkit-backdrop-filter: blur(20px) saturate(190%);
            border: 1px solid rgba(255, 255, 255, 0.45);
            box-shadow: 0 20px 40px -15px rgba(15, 23, 42, 0.08), 0 0 50px 0 rgba(79, 70, 229, 0.04);
            border-radius: var(--radius-xl);
            padding: 40px;
            width: 100%;
            max-width: 460px;
            transition: transform 0.3s ease, box-shadow 0.3s ease, background 0.3s ease, border-color 0.3s ease;
        }
        .glass-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 25px 50px -12px rgba(15, 23, 42, 0.12), 0 0 60px 0 rgba(79, 70, 229, 0.06);
        }

        /* Theme toggle, pinned to the card corner */
        .card-theme-toggle {
            position: absolute;
            top: 18px;
            right: 18px;
            z-index: 2;
        }

        /* Rounded inputs with a leading icon */
        .form-control {
            border-radius: 9999px;
            padding: 12px 20px;
            border: 1px solid var(--border-color);
            transition: border-color var(--transition-fast), box-shadow var(--transition-fast), background-color var(--transition-fast);
            background: rgba(255, 255, 255, 0.9);
            width: 100%;
        }
        .form-control:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.15);
            outline: none;
            background: #ffffff;
        }
        .input-icon-wrapper { position: relative; display: flex; align-items: center; }
        .input-icon-wrapper .input-icon {
            position: absolute;
            left: 18px;
            color: var(--text-muted);
            pointer-events: none;
            display: flex;
        }
        .input-icon-wrapper .form-control { padding-left: 48px; }

        /* Spinner */
        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(0, 0, 0, 0.1);
            border-radius: 50%;
            border-top-color: var(--primary);
            animation: spin 0.8s linear infinite;
        }
        .btn-spinner { border-top-color: currentColor; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Password field + eye toggle */
        .password-input-wrapper { position: relative; display: flex; align-items: center; }
        .password-input-wrapper .form-control { width: 100%; padding-right: 50px; }
        .toggle-password-btn {
            position: absolute;
            right: 15px;
            background: none;
            border: none;
            cursor: pointer;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 5px;
            transition: color var(--transition-fast), transform 0.2s ease;
        }
        .toggle-password-btn:hover { color: var(--primary); transform: scale(1.1); }

        /* Remember me & forgot */
        .remember-forgot-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 20px 0;
            font-size: 14px;
        }
        .remember-checkbox-label {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            color: var(--text-muted);
        }
        .remember-checkbox { width: 16px; height: 16px; border-radius: 4px; border: 1px solid var(--border-color); cursor: pointer; accent-color: var(--primary); }
        .forgot-password-link { color: var(--primary); font-weight: 600; }
        .forgot-password-link:hover { color: var(--primary-hover); text-decoration: underline; }

        /* Buttons */
        .btn {
            border-radius: 9999px;
            font-family: var(--font-heading);
            font-weight: 600;
            letter-spacing: 0.3px;
            transition: transform 0.2s ease, box-shadow 0.2s ease, background-color 0.2s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        .btn:active:not(:disabled) { transform: scale(0.97); }
        .btn-primary:hover:not(:disabled) { box-shadow: 0 4px 12px rgba(79, 70, 229, 0.25); background-color: var(--primary-hover); }
        .btn-primary:disabled { background-color: #cbd5e1; border-color: #cbd5e1; color: #94a3b8; cursor: not-allowed; }

        /* Divider */
        .auth-divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 22px 0;
            color: var(--text-muted);
            font-size: 13px;
            font-weight: 500;
        }
        .auth-divider::before, .auth-divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background: var(--border-color);
        }

        /* Google button */
        .btn-google {
            width: 100%;
            gap: 10px;
            background: #ffffff;
            border: 1px solid var(--border-color);
            color: var(--text-main);
        }
        .btn-google:hover { background: #f8fafc; border-color: #cbd5e1; }

        /* ===== Dark-mode overrides for this page's inline-styled elements ===== */
        :root[data-theme="dark"] .auth-wrapper {
            background: linear-gradient(135deg, #0b1120 0%, #020617 100%);
        }
        :root[data-theme="dark"] .glass-card {
            background: rgba(17, 24, 39, 0.72);
            border-color: rgba(148, 163, 184, 0.12);
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.5), 0 0 50px 0 rgba(79, 70, 229, 0.08);
        }
        :root[data-theme="dark"] .blob { opacity: 0.22; }
        :root[data-theme="dark"] .form-control {
            background: rgba(2, 6, 23, 0.6);
            border-color: var(--border-color);
            color: var(--text-main);
        }
        :root[data-theme="dark"] .form-control:focus { background: rgba(2, 6, 23, 0.85); }
        :root[data-theme="dark"] .btn-google { background: #1f2937; color: var(--text-main); }
        :root[data-theme="dark"] .btn-google:hover { background: #273449; }
    </style>
</head>
<body>

    <!-- Shared Navigation Bar -->
    <header id="navbar-container"></header>

    <main class="auth-wrapper">
        <div class="auth-bg-blobs">
            <div class="blob blob-1"></div>
            <div class="blob blob-2"></div>
        </div>

        <div class="auth-card glass-card">
            <button type="button" id="theme-toggle" class="theme-toggle-btn card-theme-toggle" aria-label="Toggle theme"></button>

            <div class="auth-header">
                <h2 class="auth-title">Welcome Back</h2>
                <p class="auth-subtitle">Sign in to your ShopSphere account to continue</p>
            </div>

            <form id="login-form" novalidate>
                <!-- Email -->
                <div class="form-group" id="email-group">
                    <label for="email-input" class="form-label">Email Address</label>
                    <div class="input-icon-wrapper">
                        <span class="input-icon">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" width="18" height="18">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M21.75 6.75v10.5a2.25 2.25 0 01-2.25 2.25h-15a2.25 2.25 0 01-2.25-2.25V6.75m19.5 0A2.25 2.25 0 0019.5 4.5h-15a2.25 2.25 0 00-2.25 2.25m19.5 0v.243a2.25 2.25 0 01-1.07 1.916l-7.5 4.615a2.25 2.25 0 01-2.36 0L3.32 8.91a2.25 2.25 0 01-1.07-1.916V6.75" />
                            </svg>
                        </span>
                        <input type="email" id="email-input" class="form-control" placeholder="name@example.com" required autocomplete="email">
                    </div>
                    <span class="form-error-msg" id="email-error">Please enter a valid email address.</span>
                </div>

                <!-- Password -->
                <div class="form-group" id="password-group">
                    <label for="password-input" class="form-label">Password</label>
                    <div class="input-icon-wrapper password-input-wrapper">
                        <span class="input-icon">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" width="18" height="18">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M16.5 10.5V6.75a4.5 4.5 0 10-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 002.25-2.25v-6.75a2.25 2.25 0 00-2.25-2.25H6.75a2.25 2.25 0 00-2.25 2.25v6.75a2.25 2.25 0 002.25 2.25z" />
                            </svg>
                        </span>
                        <input type="password" id="password-input" class="form-control" placeholder="••••••••" required autocomplete="current-password">
                        <button type="button" class="toggle-password-btn" id="toggle-password-btn" aria-label="Toggle password visibility">
                            <svg class="eye-icon" id="eye-open-svg" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" width="20" height="20">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z" />
                                <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                            </svg>
                            <svg class="eye-icon" id="eye-closed-svg" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" width="20" height="20" style="display: none;">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 001.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.45 10.45 0 0112 4.5c4.756 0 8.773 3.162 10.065 7.498a10.523 10.523 0 01-4.293 5.774M6.228 6.228L3 3m3.228 3.228l3.65 3.65m7.894 7.894L21 21m-3.228-3.228l-3.65-3.65m0 0a3 3 0 10-4.243-4.243m4.242 4.242L9.88 9.88" />
                            </svg>
                        </button>
                    </div>
                    <span class="form-error-msg" id="password-error">Password is required.</span>
                </div>

                <!-- Remember me & forgot -->
                <div class="remember-forgot-row">
                    <label class="remember-checkbox-label">
                        <input type="checkbox" id="remember-me" class="remember-checkbox">
                        <span>Remember Me</span>
                    </label>
                    <a href="#" class="forgot-password-link" id="forgot-password-link">Forgot Password?</a>
                </div>

                <!-- Submit -->
                <button type="submit" class="btn btn-primary" id="submit-btn" style="width: 100%; height: 46px;">
                    <span class="submit-btn-text">Sign In</span>
                    <span class="spinner btn-spinner" id="login-spinner" style="display: none; border-color: #fff #fff transparent transparent; margin-left: 8px;"></span>
                </button>
            </form>

            <div class="auth-divider">or</div>

            <!-- Continue with Google (placeholder until the Google slice) -->
            <button type="button" class="btn btn-google" id="google-btn">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="18" height="18" aria-hidden="true">
                    <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
                    <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
                    <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
                    <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
                </svg>
                Continue with Google
            </button>

            <div class="auth-redirect">
                Don't have an account? <a href="register.html">Sign up</a>
            </div>
        </div>
    </main>

    <!-- Page logic -->
    <script type="module" src="js/login.js"></script>
</body>
</html>
