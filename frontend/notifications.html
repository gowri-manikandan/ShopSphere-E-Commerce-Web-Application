<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Stay updated with your orders and account activity on Sri Maruthi textiles.">
    <title>Notifications — Sri Maruthi textiles</title>
    <!-- Stylesheet -->
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <!-- Shared Navigation Bar -->
    <header id="navbar-container"></header>

    <!-- Main Content Area -->
    <main class="container notif-page-container">
        <!-- Header with Title, Subtitle, and Mark All As Read Button -->
        <div class="notif-page-header">
            <div class="notif-header-left">
                <h1 class="notif-page-title">Notifications</h1>
                <p class="notif-page-subtitle">Stay updated with your orders and account activity.</p>
            </div>
            <div class="notif-header-right">
                <button type="button" id="mark-all-read-btn" class="btn-mark-all-read">
                    <span>Mark all as read</span>
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.2" stroke="currentColor" width="15" height="15">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12.75l6 6 9-13.5" />
                    </svg>
                </button>
            </div>
        </div>

        <!-- Two Column Layout: Sidebar & Content -->
        <div class="notif-layout">
            <!-- Sidebar Categories Filter -->
            <aside class="notif-sidebar">
                <nav class="notif-category-nav" id="notif-category-nav">
                    <button type="button" class="notif-cat-btn active" data-category="all">
                        <div class="notif-cat-icon-text">
                            <svg class="notif-cat-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor" width="18" height="18">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M14.857 17.082a23.848 23.848 0 005.454-1.31A8.967 8.967 0 0118 9.75V9A6 6 0 006 9v.75a8.967 8.967 0 01-2.312 6.022c1.733.64 3.56 1.085 5.455 1.31m5.714 0a24.255 24.255 0 01-5.714 0m5.714 0a3 3 0 11-5.714 0" />
                            </svg>
                            <span>All Notifications</span>
                        </div>
                        <span class="notif-cat-badge" id="badge-all">0</span>
                    </button>

                    <button type="button" class="notif-cat-btn" data-category="orders">
                        <div class="notif-cat-icon-text">
                            <svg class="notif-cat-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor" width="18" height="18">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M20.25 7.5l-.625 10.632a2.25 2.25 0 01-2.247 2.118H6.622a2.25 2.25 0 01-2.247-2.118L3.75 7.5M10 11.25h4M3.375 7.5h17.25c.621 0 1.125-.504 1.125-1.125v-1.5c0-.621-.504-1.125-1.125-1.125H3.375c-.621 0-1.125.504-1.125 1.125v1.5c0 .621.504 1.125 1.125 1.125z" />
                            </svg>
                            <span>Orders</span>
                        </div>
                        <span class="notif-cat-badge" id="badge-orders">0</span>
                    </button>

                    <button type="button" class="notif-cat-btn" data-category="offers">
                        <div class="notif-cat-icon-text">
                            <svg class="notif-cat-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor" width="18" height="18">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M9.568 3H5.25A2.25 2.25 0 003 5.25v4.318c0 .597.237 1.17.659 1.591l9.581 9.581c.699.699 1.78.872 2.607.33a18.095 18.095 0 005.223-5.223c.542-.827.369-1.908-.33-2.607L11.16 3.66A2.25 2.25 0 009.568 3z" />
                                <path stroke-linecap="round" stroke-linejoin="round" d="M6 6h.008v.008H6V6z" />
                            </svg>
                            <span>Offers</span>
                        </div>
                        <span class="notif-cat-badge" id="badge-offers">0</span>
                    </button>

                    <button type="button" class="notif-cat-btn" data-category="account">
                        <div class="notif-cat-icon-text">
                            <svg class="notif-cat-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor" width="18" height="18">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.499-1.632z" />
                            </svg>
                            <span>Account</span>
                        </div>
                        <span class="notif-cat-badge" id="badge-account">0</span>
                    </button>

                    <button type="button" class="notif-cat-btn" data-category="system">
                        <div class="notif-cat-icon-text">
                            <svg class="notif-cat-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor" width="18" height="18">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M9.594 3.94c.09-.542.56-.94 1.11-.94h2.593c.55 0 1.02.398 1.11.94l.213 1.281c.063.374.313.686.645.87.074.04.147.083.22.127.324.196.72.257 1.075.124l1.217-.456a1.125 1.125 0 011.37.49l1.296 2.247a1.125 1.125 0 01-.26 1.431l-1.003.827c-.293.24-.438.613-.431.992a6.759 6.759 0 010 .255c-.007.378.138.75.43.99l1.005.828c.424.35.534.954.26 1.43l-1.298 2.247a1.125 1.125 0 01-1.369.491l-1.217-.456c-.355-.133-.75-.072-1.076.124a6.57 6.57 0 01-.22.128c-.331.183-.581.495-.644.869l-.213 1.28c-.09.543-.56.941-1.11.941h-2.594c-.55 0-1.02-.398-1.11-.94l-.213-1.281c-.062-.374-.312-.686-.644-.87a6.52 6.52 0 01-.22-.127c-.325-.196-.72-.257-1.076-.124l-1.217.456a1.125 1.125 0 01-1.369-.49l-1.297-2.247a1.125 1.125 0 01.26-1.431l1.004-.827c.292-.24.437-.613.43-.992a6.932 6.932 0 010-.255c.007-.378-.138-.75-.43-.99l-1.004-.828a1.125 1.125 0 01-.26-1.43l1.297-2.247a1.125 1.125 0 011.37-.491l1.216.456c.356.133.751.072 1.076-.124.072-.044.146-.087.22-.128.332-.183.582-.495.644-.869l.214-1.281z" />
                                <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                            </svg>
                            <span>System</span>
                        </div>
                        <span class="notif-cat-badge" id="badge-system">0</span>
                    </button>
                </nav>
            </aside>

            <!-- Main Notifications Content -->
            <section class="notif-main-panel">
                <!-- Notifications Card List -->
                <div id="notif-list" class="notif-card-list">
                    <!-- Dynamic notification cards -->
                </div>

                <!-- Empty State -->
                <div id="notif-empty" class="empty-state notif-empty-state" style="display: none;">
                    <div class="empty-icon">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" width="56" height="56">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M14.857 17.082a23.848 23.848 0 005.454-1.31A8.967 8.967 0 0118 9.75V9A6 6 0 006 9v.75a8.967 8.967 0 01-2.312 6.022c1.733.64 3.56 1.085 5.455 1.31m5.714 0a24.255 24.255 0 01-5.714 0m5.714 0a3 3 0 11-5.714 0" />
                        </svg>
                    </div>
                    <h3 class="empty-title">No notifications yet</h3>
                    <p class="empty-desc" id="notif-empty-desc">You're all caught up! Order updates, offers, and account alerts will appear here.</p>
                </div>

                <!-- Pagination Container -->
                <div id="notif-pagination" class="notif-pagination" style="display: none;">
                    <!-- Dynamic page buttons -->
                </div>
            </section>
        </div>
    </main>

    <!-- Realtime (live notifications) -->
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1.6.1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7.0.0/bundles/stomp.umd.min.js"></script>

    <!-- Main JavaScript Logic -->
    <script type="module" src="js/notifications.js"></script>
</body>
</html>
