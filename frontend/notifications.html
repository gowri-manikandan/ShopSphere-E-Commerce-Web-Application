<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Your notifications on ShopSphere.">
    <title>Notifications — ShopSphere</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header id="navbar-container"></header>

    <main class="container" style="max-width: 760px;">
        <h2 style="font-size: 28px; font-weight: 800; margin-bottom: 24px;">Notifications</h2>

        <div id="notif-list" class="notif-list">
            <p class="loader-text">Loading notifications…</p>
        </div>

        <div id="notif-empty" class="empty-state" style="display: none;">
            <div class="empty-icon">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" width="64" height="64">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M14.857 17.082a23.848 23.848 0 005.454-1.31A8.967 8.967 0 0118 9.75V9A6 6 0 006 9v.75a8.967 8.967 0 01-2.312 6.022c1.733.64 3.56 1.085 5.455 1.31m5.714 0a24.255 24.255 0 01-5.714 0m5.714 0a3 3 0 11-5.714 0" />
                </svg>
            </div>
            <p style="font-weight: 600; margin: 12px 0 4px;">No notifications yet.</p>
            <p style="color: var(--text-muted);">Order updates will show up here.</p>
        </div>
    </main>

    <script type="module" src="js/notifications.js"></script>
</body>
</html>
