<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Your saved products on Sri Maruthi textiles.">
    <title>My Wishlist — Sri Maruthi textiles</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header id="navbar-container"></header>

    <main class="container">
        <h2 style="font-size: 28px; font-weight: 800; margin-bottom: 24px;">My Wishlist</h2>

        <div id="wishlist-grid" class="product-grid">
            <p class="loader-text">Loading your wishlist…</p>
        </div>

        <div id="wishlist-empty" class="empty-state" style="display: none;">
            <div class="empty-icon">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" width="64" height="64">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M21 8.25c0-2.485-2.099-4.5-4.688-4.5-1.935 0-3.597 1.126-4.312 2.733-.715-1.607-2.377-2.733-4.313-2.733C5.1 3.75 3 5.765 3 8.25c0 7.22 9 12 9 12s9-4.78 9-12z" />
                </svg>
            </div>
            <p style="font-weight: 600; margin: 12px 0 4px;">Your wishlist is empty.</p>
            <p style="color: var(--text-muted); margin-bottom: 16px;">Tap the heart on any product to save it here.</p>
            <a href="index.html" class="btn btn-primary">Browse Products</a>
        </div>
    </main>

    <script type="module" src="js/wishlist.js"></script>
</body>
</html>
