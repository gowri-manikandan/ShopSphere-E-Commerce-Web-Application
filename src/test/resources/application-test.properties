# Test profile — dedicated MySQL schema so dev data is never touched.
# The schema is auto-created on connect; Flyway then builds V1 + V2 fresh.
spring.datasource.url=${TEST_DB_URL:jdbc:mysql://localhost:3306/shopsphere_test?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:12345678}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
