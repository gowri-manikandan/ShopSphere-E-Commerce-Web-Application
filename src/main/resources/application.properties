spring.application.name=ShopSphere

# ===== MySQL Database =====
# Override via env vars in production; defaults keep local dev working.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/shopsphere?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:12345678}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== JPA / Hibernate =====
# Flyway now owns the schema; Hibernate only validates entities against it.
# (Override JPA_DDL_AUTO=update locally if you want Hibernate to auto-apply
#  entity changes during rapid prototyping — but prefer writing a migration.)
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ===== Flyway (database migrations) =====
spring.flyway.enabled=${FLYWAY_ENABLED:true}
# Adopt an already-populated DB at V1 instead of trying to recreate it.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# ===== Server =====
server.port=${SERVER_PORT:8080}

# ===== JWT =====
# IMPORTANT: set JWT_SECRET in the environment for production (>= 64 chars for HS512).
app.jwt.secret=${JWT_SECRET:ShopSphereSuperSecretKeyChangeMeInProductionEnvironment1234567890ABCDEF}
# Access token: short-lived (15 min, §7). The frontend silently refreshes via the httpOnly
# refresh-token cookie when it gets a 401.
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:900000}
# Refresh token lifetime (default 7 days)
app.jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}

# Refresh-token cookie (§7). Stored HttpOnly so JS/XSS can't read it. Defaults suit local http
# dev (Lax, non-Secure). In production over HTTPS with a cross-site frontend, set
# REFRESH_COOKIE_SAMESITE=None and REFRESH_COOKIE_SECURE=true.
app.auth.refresh-cookie.secure=${REFRESH_COOKIE_SECURE:false}
app.auth.refresh-cookie.same-site=${REFRESH_COOKIE_SAMESITE:Lax}

# ===== Real-time (WebSocket/STOMP, §5) =====
# Stock level at or below which broadcasts report LOW_STOCK
app.stock.low-threshold=${STOCK_LOW_THRESHOLD:5}

# ===== Google Sign-In =====
# OAuth 2.0 Web client ID from Google Cloud Console. Leave empty to disable Google sign-in
# (the /api/auth/google endpoint then returns a clear "not configured" error).
# Non-empty default so the app boots without committing a real secret (Spring's OAuth2
# client auto-config rejects an empty client-id). Set the real value via the GOOGLE_CLIENT_ID
# env var to actually enable Google sign-in.
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:disabled}

spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:disabled}

spring.security.oauth2.client.registration.google.scope=email,profile

# ===== File Uploads / Cloudinary (§15) =====
# Multipart limits (the framework default is 1MB, which silently rejects valid 2MB avatars).
spring.servlet.multipart.max-file-size=${MAX_UPLOAD_SIZE:2MB}
spring.servlet.multipart.max-request-size=${MAX_UPLOAD_REQUEST_SIZE:3MB}
# Avatar storage: with Cloudinary creds set, avatars go to the CDN and the absolute URL is
# stored in the DB; otherwise they fall back to the local dir below (ephemeral on Render).
app.storage.local-dir=${UPLOAD_LOCAL_DIR:frontend/uploads/}
app.cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
app.cloudinary.api-key=${CLOUDINARY_API_KEY:}
app.cloudinary.api-secret=${CLOUDINARY_API_SECRET:}
app.cloudinary.folder=${CLOUDINARY_FOLDER:shopsphere/avatars}

# ===== Razorpay Payments (§9) =====
# Leave the keys empty to run without live payments: the app still boots, COD checkout
# works, and card/UPI/netbanking fall back to a mock success locally. Set the test keys
# (rzp_test_...) from the Razorpay dashboard to enable the real Checkout widget. The
# webhook needs RAZORPAY_WEBHOOK_SECRET (the secret you set on the dashboard endpoint).
# key-id is returned to the frontend so the Razorpay Checkout widget can open.
app.razorpay.key-id=${RAZORPAY_KEY_ID:}
app.razorpay.key-secret=${RAZORPAY_KEY_SECRET:}
app.razorpay.webhook-secret=${RAZORPAY_WEBHOOK_SECRET:}
app.razorpay.currency=${RAZORPAY_CURRENCY:INR}

# ===== Auth rate limiting (§7) =====
# Per client-IP token bucket on login/register/OTP/forgot-password: `capacity` requests,
# refilling over `window-seconds`. Exceeding it returns 429.
app.ratelimit.auth.capacity=${AUTH_RATELIMIT_CAPACITY:5}
app.ratelimit.auth.window-seconds=${AUTH_RATELIMIT_WINDOW_SECONDS:60}

# ===== CORS (frontend origin) =====
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5500,http://127.0.0.1:5500,http://localhost:3000}

# ===== AI Embeddings / Semantic Search (§6) =====
# provider: local (default, offline, no deps) | ollama (local server) | openai (needs key + reachable HTTPS)
app.embedding.enabled=${EMBEDDING_ENABLED:true}
app.embedding.provider=${EMBEDDING_PROVIDER:local}
app.embedding.dimensions=${EMBEDDING_DIMENSIONS:256}
app.embedding.ollama.base-url=${OLLAMA_URL:http://localhost:11434}
app.embedding.ollama.model=${OLLAMA_MODEL:nomic-embed-text}
app.embedding.openai.base-url=${OPENAI_URL:https://api.openai.com/v1}
app.embedding.openai.model=${OPENAI_EMBED_MODEL:text-embedding-3-small}
app.embedding.openai.api-key=${OPENAI_API_KEY:}

# ===== Email / SMTP Configuration =====
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS_ENABLE:true}
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.protocols=TLSv1.2
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000


